<h2>Catálogo de libros</h2>
<button (click)="cerrarSesion()">Cerrar sesión</button>

<p>Total de libros: {{ libros.length }}</p>

@if (libros.length === 0) {
  <p>No hay libros registrados.</p>
} @else {
  <table border="1" cellpadding="6">
    <thead>
      <tr><th>ID</th><th>Código</th><th>Título</th><th>Autor</th><th>Año</th></tr>
    </thead>
    <tbody>
      @for (l of libros; track l.id) {
        <tr>
          <td>{{ l.id }}</td>
          <td>{{ l.codigo }}</td>
          <td>{{ l.titulo }}</td>
          <td>{{ l.autor }}</td>
          <td>{{ l.anio }}</td>
        </tr>
      }
    </tbody>
  </table>
}
